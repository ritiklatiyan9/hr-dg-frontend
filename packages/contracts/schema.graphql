extend type Query { approvalQueue(siteId: ID!): JSON! }
extend type Query { dashboard(siteId: ID!): JSON! }
extend type Query { employeeLookup(siteId: ID!, search: String!): JSON! }
extend type Query { analytics(siteId: ID!,input: JSON!): JSON! }
extend type Mutation { explainAnalytics(siteId: ID!,input: JSON!): JSON! }

extend type Query { trackingContext(siteId: ID!): JSON! trackingMonitor(siteId: ID!, input: JSON!): JSON! }
